<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Instachorda</title>
  <style>
    body { font-family: -apple-system, sans-serif; width: 260px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 10px 0; }
    .row { margin: 8px 0; font-size: 12px; }
    label { display: block; color: #555; margin-bottom: 4px; }
    select { font-size: 12px; padding: 4px 6px; width: 100%; box-sizing: border-box; }
    .mode-group { display: flex; gap: 0; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; }
    .mode-group button {
      flex: 1; font-size: 11px; padding: 6px 4px; border: none; background: #f5f5f5;
      cursor: pointer; border-right: 1px solid #ccc;
    }
    .mode-group button:last-child { border-right: none; }
    .mode-group button.active { background: #22c55e; color: white; font-weight: 600; }
    .mode-group button:hover:not(.active) { background: #e8e8e8; }
    #status { color: #888; font-size: 11px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>Instachorda</h1>
  <div class="row">
    <label>표시 모드</label>
    <div class="mode-group" id="modeGroup">
      <button data-mode="original-only">코드만</button>
      <button data-mode="both">코드+KANTAN</button>
      <button data-mode="kantan-only">KANTAN만</button>
    </div>
  </div>
  <div class="row">
    <label>기본 키</label>
    <select id="keySelect">
      <option value="auto">자동</option>
    </select>
  </div>
  <div id="status">초기화 중...</div>
  <script src="popup.js"></script>
</body>
</html>
