[project]
name = "instachorda"
version = "0.1.0"
description = "PDF 악보의 표준 기타 코드를 KANTAN 숫자 표기로 변환하는 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeong Ju, Kim" }]
dependencies = [
    "pymupdf>=1.24",
]

[project.scripts]
instachorda = "instachorda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instachorda"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
